services:

  # =========================================================
  # DJANGO (gunicorn) — não expõe mais porta pro host,
  # quem fala com ele agora é o nginx via rede interna
  # =========================================================
  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    env_file: .env
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  # =========================================================
  # POSTGRES
  # =========================================================
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beauty_formula}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================
  # REDIS
  # =========================================================
  redis:
    image: redis:7-alpine
    restart: always

  # =========================================================
  # CELERY WORKER
  # =========================================================
  celery:
    build: .
    command: celery -A config worker -l info --concurrency 4
    env_file: .env
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  # =========================================================
  # CELERY BEAT
  # =========================================================
  celery-beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    restart: always
    depends_on:
      - redis

  # =========================================================
  # MINIO
  # =========================================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET_MEDIA:-beautyformulamedia};
      mc mb --ignore-existing local/${MINIO_BUCKET_STATIC:-beautyformulastatic};
      mc anonymous set download local/${MINIO_BUCKET_STATIC:-beautyformulastatic};
      exit 0;
      "
    env_file: .env

  # =========================================================
  # NGINX + FRONTEND
  # Builda a SPA (formula-da-beleza) e a serve, além de
  # fazer proxy para /api, /admin e /static do Django.
  # Assume que os repos estão lado a lado:
  #   /srv/formula-da-beleza/beauty-formula/        (aqui está este compose)
  #   /srv/formula-da-beleza/formula-da-beleza/      (repo do frontend)
  # =========================================================
  nginx:
    build:
      context: ../formula-da-beleza
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    restart: always

# =========================================================
# VOLUMES
# =========================================================
volumes:
  postgres_data:
  minio_data:
  static_volume: