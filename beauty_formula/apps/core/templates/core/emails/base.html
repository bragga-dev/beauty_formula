<!-- ============================================================
     FILE: base.html
     Layout base dos e-mails Fórmula da Beleza.

     Identidade visual — espelha 1:1 o tema do front-end
     (src/index.css / Tailwind theme):
       ink-950 #0a0a0b   fundo geral
       ink-900 #0f0f11   fundo do card
       ink-800 #17171a   blocos internos / info-box
       ink-700 #202023   bordas
       ink-600 #2b2b2f   bordas hover / divisores
       bone-50  #faf9f7  títulos
       bone-100 #f2f0ec  texto principal
       bone-300 #cfccc5  texto secundário
       bone-500 #8f8c86  texto mudo / labels
       bone-600 #6b6862  texto mudo (footer)
       crimson-400 #e23a52  hover / destaque claro
       crimson-500 #c6172e  cor primária da marca
       crimson-600 #a10f24  ativo / borda
       gold-300 #e6c98a   hover do dourado
       gold-400 #d4af6a   accent / CTA "gold"
       gold-500 #b8923f   texto sobre dourado

     Fontes: Oswald (display / headings, uppercase, tracking-wide)
             Inter (corpo de texto)
     Raio de borda: 10px (var --radius-card do front), como os
     Cards do site — não usamos mais "pill" nos botões/cards.
     ============================================================ -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="dark light">
    <meta name="supported-color-schemes" content="dark light">
    <title>{% block title %}Fórmula da Beleza{% endblock %}</title>

    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->

    <style>
        /* ── Reset ─────────────────────────────────────────────── */
        * { box-sizing: border-box; }
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; display: block; outline: none; text-decoration: none; }
        body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            background-color: #0a0a0b;
        }

        /* ── Preheader ─────────────────────────────────────────── */
        .preheader {
            display: none !important;
            visibility: hidden;
            mso-hide: all;
            font-size: 1px;
            line-height: 1px;
            max-height: 0;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
        }

        /* ── Wrapper ───────────────────────────────────────────── */
        .email-wrapper {
            background-color: #0a0a0b;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(198,23,46,0.10), transparent),
                radial-gradient(ellipse 60% 40% at 100% 0%, rgba(212,175,106,0.06), transparent);
            width: 100%;
            padding: 48px 16px;
        }

        /* ── Card ──────────────────────────────────────────────── */
        .email-card {
            background-color: #0f0f11;
            border: 1px solid #202023;
            border-radius: 14px;
            overflow: hidden;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 24px 60px rgba(0,0,0,0.55);
        }

        /* ── Header ────────────────────────────────────────────── */
        .header {
            background: #0a0a0b;
            border-bottom: 1px solid #202023;
            padding: 36px 40px 28px;
            text-align: center;
        }

        .logo-badge {
            display: inline-block;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #17171a;
            border: 1px solid rgba(212,175,106,0.5);
            margin: 0 auto 16px;
            line-height: 50px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: 22px;
            color: #c6172e;
            text-align: center;
        }

        .logo-title {
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-weight: 600;
            font-size: 12px;
            color: #d4af6a;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0;
            line-height: 1.4;
        }

        .logo-title-main {
            display: block;
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-weight: 600;
            font-size: 20px;
            color: #faf9f7;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 2px 0 0;
        }

        .header-tagline {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: #8f8c86;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 12px 0 0;
        }

        .header-stripe {
            display: block;
            width: 44px;
            height: 2px;
            background: linear-gradient(90deg, #c6172e, #d4af6a 60%, transparent);
            margin: 20px auto 0;
        }

        /* ── Body ──────────────────────────────────────────────── */
        .body-cell {
            padding: 40px 40px 44px;
            background-color: #0f0f11;
        }

        /* ── Content blocks (usados pelos templates filhos) ────── */
        .section-label {
            display: inline-block;
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #e23a52;
            background: rgba(198,23,46,0.12);
            border: 1px solid rgba(198,23,46,0.3);
            padding: 5px 14px;
            border-radius: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 18px;
        }

        .section-label.gold {
            color: #d4af6a;
            background: rgba(212,175,106,0.1);
            border-color: rgba(212,175,106,0.3);
        }

        .heading {
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 26px;
            font-weight: 600;
            color: #faf9f7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0 0 22px;
            line-height: 1.3;
        }

        .greeting {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 15px;
            color: #f2f0ec;
            margin: 0 0 10px;
            line-height: 1.7;
        }

        .greeting strong {
            color: #e23a52;
        }

        .body-text {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 15px;
            color: #cfccc5;
            margin: 0 0 28px;
            line-height: 1.75;
        }

        .body-text strong {
            color: #f2f0ec;
        }

        .info-box {
            background: #17171a;
            border: 1px solid #202023;
            border-left: 3px solid #c6172e;
            border-radius: 10px;
            padding: 20px 24px;
            margin-bottom: 24px;
        }

        .info-box.gold {
            border-left-color: #d4af6a;
        }

        .info-box.plain {
            border-left: 1px solid #202023;
        }

        .info-box-title {
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #faf9f7;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0 0 10px;
        }

        .info-box-text {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: #8f8c86;
            margin: 0;
            line-height: 1.8;
        }

        .info-box-text strong {
            color: #f2f0ec;
            font-weight: 600;
        }

        .info-box-text a {
            color: #e23a52;
            text-decoration: none;
        }

        .cta-wrap {
            text-align: center;
            margin: 8px 0 26px;
        }

        .cta-btn {
            display: inline-block;
            background: #c6172e;
            color: #faf9f7 !important;
            text-decoration: none !important;
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 16px 44px;
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(198,23,46,0.25);
        }

        .cta-btn-gold {
            display: inline-block;
            background: #d4af6a;
            color: #0a0a0b !important;
            text-decoration: none !important;
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 16px 44px;
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(212,175,106,0.2);
        }

        .cta-btn-secondary {
            display: inline-block;
            background: transparent;
            color: #cfccc5 !important;
            text-decoration: none !important;
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 14px 32px;
            border-radius: 10px;
            border: 1px solid #3a3a40;
            margin-top: 10px;
        }

        .link-fallback {
            text-align: center;
            margin-bottom: 28px;
        }

        .link-fallback p {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 12px;
            color: #6b6862;
            margin: 0 0 8px;
        }

        .link-fallback a {
            display: inline-block;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 12px;
            color: #e23a52;
            background: #17171a;
            border: 1px solid #202023;
            border-radius: 8px;
            padding: 10px 16px;
            word-break: break-all;
            text-decoration: none;
        }

        .warning-box {
            background: #17171a;
            border: 1px solid #202023;
            border-radius: 10px;
            padding: 18px 22px;
        }

        .warning-box p {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 13px;
            color: #8f8c86;
            margin: 0;
            line-height: 1.75;
        }

        .warning-box strong {
            color: #d4af6a;
        }

        .divider {
            border: none;
            border-top: 1px solid #202023;
            margin: 28px 0 20px;
        }

        .closing-note {
            text-align: center;
            margin-top: 32px;
            padding: 20px;
            border-top: 1px solid #202023;
        }

        .closing-note p.script {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: #8f8c86;
            font-style: italic;
            margin: 0;
        }

        .closing-note p.team {
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #6b6862;
            margin: 10px 0 0;
        }

        /* ── Footer ────────────────────────────────────────────── */
        .footer {
            background: #0a0a0b;
            border-top: 1px solid #202023;
            padding: 30px 40px;
            text-align: center;
        }

        .footer-logo {
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #faf9f7;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }

        .footer-logo span { color: #d4af6a; }

        .footer-tagline {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-style: italic;
            font-size: 12px;
            color: #6b6862;
            margin: 8px 0 0;
        }

        .footer-divider {
            width: 32px;
            height: 1px;
            background: #202023;
            margin: 18px auto;
            border: none;
        }

        .footer-auto {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 11px;
            color: #3a3a40;
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* ── Shared widgets (usados por vários templates filhos) ── */
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0 4px;
        }

        .detail-item {
            background: #0f0f11;
            border: 1px solid #202023;
            border-radius: 8px;
            padding: 14px 16px;
            text-align: center;
        }

        .detail-item .label {
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: #6b6862;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 6px;
        }

        .detail-item .value {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #f2f0ec;
            display: block;
        }

        .detail-item .value.price {
            color: #e23a52;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 50px;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 12px;
            font-weight: 600;
            background: rgba(212,175,106,0.12);
            color: #d4af6a;
        }

        .status-badge.cancelled {
            background: rgba(220,53,69,0.14);
            color: #e23a52;
        }

        .status-badge.success {
            background: rgba(47,158,92,0.14);
            color: #2f9e5c;
        }

        .service-name {
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #faf9f7;
            margin: 0 0 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .service-description {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: #8f8c86;
            margin: 0 0 14px;
            line-height: 1.7;
        }

        .service-image {
            width: 100%;
            max-width: 220px;
            height: auto;
            border-radius: 8px;
            margin: 0 0 16px;
            border: 1px solid #202023;
        }

        .employee-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .employee-photo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(212,175,106,0.5);
        }

        .employee-details { flex: 1; }

        .employee-name {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #f2f0ec;
            margin: 0 0 4px;
        }

        .employee-bio {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 13px;
            color: #8f8c86;
            margin: 0;
            line-height: 1.6;
        }

        .client-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .client-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #17171a;
            border: 1px solid rgba(198,23,46,0.4);
            color: #e23a52;
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            line-height: 44px;
        }

        .client-name {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #f2f0ec;
            margin: 0;
        }

        .notes-box {
            background: #0f0f11;
            border: 1px solid #202023;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 14px;
        }

        .notes-box p {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 13px;
            color: #8f8c86;
            margin: 0;
            line-height: 1.6;
        }

        .reason-box {
            background: #0f0f11;
            border: 1px solid #202023;
            border-radius: 8px;
            padding: 16px 20px;
            margin-top: 14px;
        }

        .reason-box p {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: #8f8c86;
            margin: 0;
            line-height: 1.7;
        }

        .reason-box strong { color: #f2f0ec; }

        .highlight-badge {
            display: inline-block;
            background: rgba(212,175,106,0.12);
            border: 1px solid rgba(212,175,106,0.35);
            color: #d4af6a !important;
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 50px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .stars {
            text-align: center;
            font-size: 30px;
            letter-spacing: 4px;
            color: #d4af6a;
            margin: 6px 0 14px;
        }

        .message-box {
            background: #0f0f11;
            border: 1px solid #202023;
            border-left: 3px solid #d4af6a;
            border-radius: 10px;
            padding: 18px 22px;
            margin-bottom: 24px;
        }

        .message-box p {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: #cfccc5;
            font-style: italic;
            margin: 0;
            line-height: 1.75;
        }

        .action-box {
            background: #17171a;
            border: 1px solid rgba(198,23,46,0.25);
            border-radius: 10px;
            padding: 20px 24px;
            margin-bottom: 8px;
        }

        .action-box p {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: #8f8c86;
            margin: 0;
            line-height: 1.7;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .feature-item {
            background: #0f0f11;
            border: 1px solid #202023;
            border-radius: 8px;
            padding: 16px 14px;
            text-align: center;
        }

        .feature-item .emoji {
            display: block;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .feature-item .label {
            display: block;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #f2f0ec;
            margin-bottom: 4px;
        }

        .feature-item .desc {
            display: block;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 11px;
            color: #6b6862;
            line-height: 1.5;
        }

        .password-highlight {
            display: inline-block;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #d4af6a;
            background: #0f0f11;
            border: 1px dashed rgba(212,175,106,0.4);
            border-radius: 8px;
            padding: 10px 22px;
        }

        .payment-row {
            padding: 10px 0;
            border-bottom: 1px solid #202023;
        }

        .payment-row:last-child { border-bottom: none; }

        .payment-label {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 13px;
            color: #8f8c86;
        }

        .payment-value {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: #f2f0ec;
            font-weight: 600;
        }

        .payment-value.amount {
            font-size: 22px;
            color: #e23a52;
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-weight: 600;
        }

        .pix-section {
            background: #0f0f11;
            border: 1px dashed rgba(212,175,106,0.4);
            border-radius: 10px;
            padding: 24px;
            margin: 18px 0 24px;
            text-align: center;
        }

        .pix-section h3 {
            font-family: 'Oswald', Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #d4af6a;
            margin: 0 0 14px;
        }

        .qr-code-container {
            margin: 14px 0;
            text-align: center;
        }

        .qr-code-container img {
            max-width: 180px;
            height: auto;
            border: 1px solid #202023;
            border-radius: 10px;
            padding: 12px;
            background-color: #faf9f7;
            margin: 0 auto;
        }

        .pix-copy-area {
            background: #17171a;
            border: 1px solid #202023;
            border-radius: 8px;
            padding: 12px 16px;
            margin: 12px 0 8px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #cfccc5;
        }

        /* ── Mobile ────────────────────────────────────────────── */
        @media only screen and (max-width: 600px) {
            .email-wrapper { padding: 20px 10px !important; }
            .email-card { border-radius: 12px !important; }
            .header { padding: 28px 22px 22px !important; }
            .logo-title-main { font-size: 18px !important; }
            .body-cell { padding: 26px 22px 30px !important; }
            .heading { font-size: 21px !important; }
            .cta-btn, .cta-btn-gold, .cta-btn-secondary { display: block !important; padding: 16px 20px !important; margin-left: 0 !important; margin-top: 10px; }
            .footer { padding: 24px 22px !important; }
            .detail-grid, .feature-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .detail-item, .feature-item { padding: 12px 8px; }
            .employee-info { flex-direction: column; text-align: center; }
        }
    </style>

    {% block extra_styles %}{% endblock %}
</head>

<body>

<span class="preheader">{% block preheader %}Fórmula da Beleza{% endblock %}</span>

<div class="email-wrapper">
    <div class="email-card">

        <!-- ── HEADER ─────────────────────────────────────────── -->
        <div class="header">
            <div class="logo-badge">✂</div>
            <p class="logo-title">Fórmula<span class="logo-title-main">Da Beleza</span></p>
            <p class="header-tagline">Salão &amp; Barbearia</p>
            <span class="header-stripe"></span>
        </div>
