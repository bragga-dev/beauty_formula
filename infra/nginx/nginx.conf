# =============================================================================
# nginx.conf principal — tuning para ~1000 usuários simultâneos.
# Os server blocks ficam em templates/<modo>/default.conf.template
# (renderizados com envsubst pelo entrypoint oficial da imagem nginx).
# =============================================================================
user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;
pid  /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  8192;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logs ────────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr "$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time '
                      'cache=$upstream_cache_status "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main  buffer=64k  flush=5s;

    # ── Rede ────────────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   30s;
    keepalive_requests  1000;
    reset_timedout_connection  on;
    server_tokens       off;

    client_body_timeout    15s;
    client_header_timeout  15s;
    send_timeout           30s;
    client_max_body_size   10m;     # = FILE_UPLOAD_MAX_MEMORY_SIZE do Django

    # ── Compressão ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        application/json application/javascript text/css
                      text/plain image/svg+xml application/xml;

    # ── Rate limit (camada de borda; o Django ainda limita por rota) ────────
    # Por IP real. 20 r/s sustentados + rajada de 60 cobre SPA carregando.
    limit_req_zone  $binary_remote_addr  zone=api:20m    rate=20r/s;
    limit_req_zone  $binary_remote_addr  zone=login:10m  rate=10r/m;
    limit_req_status   429;
    limit_conn_zone $binary_remote_addr  zone=perip:10m;
    limit_conn_status  429;

    # ── Cache de mídia (proxy para o MinIO) ─────────────────────────────────
    proxy_cache_path  /var/cache/nginx/media  levels=1:2  keys_zone=media:50m
                      max_size=1g  inactive=7d  use_temp_path=off;

    # ── Upstream da API ─────────────────────────────────────────────────────
    upstream django {
        server web:8000  max_fails=3  fail_timeout=10s;
        keepalive 64;
    }

    upstream minio {
        server minio:9000;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}